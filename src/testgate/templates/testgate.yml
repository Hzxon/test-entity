name: testgate

on:
  pull_request:

jobs:
  testgate:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be used in step-level `if`, so expose one through env
      HIDDEN_REPO: ${{ secrets.TESTGATE_HIDDEN_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out hidden tests
        if: env.HIDDEN_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HIDDEN_REPO }}
          token: ${{ secrets.TESTGATE_HIDDEN_TOKEN }}
          path: .testgate-hidden

      - name: Run testgate
        uses: <owner>/testgate@v0  # placeholder: replace <owner>
        with:
          base: origin/${{ github.base_ref }}
          hidden-dir: .testgate-hidden
        env:
          TESTGATE_SEED: ${{ secrets.TESTGATE_SEED }}

      - name: Upload private log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testgate-private-log
          path: testgate-private.log
          if-no-files-found: ignore

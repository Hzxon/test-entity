name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run mypy src/testgate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: examples/discount-js
      - run: npm ci
        working-directory: examples/discount-js-cheat
      - name: Install bubblewrap (OS isolation for sandbox children, #56)
        run: |
          command -v bwrap || { sudo apt-get update -q && sudo apt-get install -y -q bubblewrap; }
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor
          bwrap --ro-bind / / --unshare-net true || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv run python -c "from testgate.sandbox import isolation_available as a; assert a(), 'no isolation'"
      - run: uv run pytest -q

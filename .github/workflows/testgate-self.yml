# Proves the action on every PR: the honest example must PASS, the cheat
# example must FAIL. The hidden tests live in-repo here only because this is
# the self-test; real projects keep them outside the repository. This job runs
# the PR's own action.yml, so it must never reference a secret (#47).
name: testgate-self

on:
  pull_request:

permissions: {}

concurrency:
  group: testgate-self-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  honest-passes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        uses: ./
        with:
          root: examples/discount
          base: origin/${{ github.base_ref }}
          hidden-dir: ${{ github.workspace }}/examples/discount-hidden
        env:
          TESTGATE_SEED: public-self-test-seed  # this job runs the PR's own action, so it gets no secrets (#47)
      - name: Verdict must be pass
        run: test "$VERDICT" = "pass"
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}

  cheat-fails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          root: examples/discount-cheat
          base: origin/${{ github.base_ref }}
          hidden-dir: ${{ github.workspace }}/examples/discount-hidden
        env:
          TESTGATE_SEED: public-self-test-seed  # this job runs the PR's own action, so it gets no secrets (#47)
      - name: Verdict must be fail
        run: test "$VERDICT" = "fail"
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}

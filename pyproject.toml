[project]
name = "testgate"
version = "0.1.0"
description = "Merge gates that an AI author cannot edit or trick: protected tests, hidden tests, flaky checks, coverage and mutation on changed lines."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "coverage>=7.4",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
]

[project.scripts]
testgate = "testgate.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
